<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Settings</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px 32px;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #222;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #444;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #065fd4;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: #065fd4;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #004dc0;
        }

        #status {
            font-size: 14px;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Settings</h1>
        <div class="form-group">
            <label for="transcript-font-size">transcript font size</label>
            <input type="text" id="transcript-font-size" placeholder="20px">
        </div>
        <div class="actions">
            <button id="save-button">Save</button>
            <div id="status"></div>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
